<body>
    <script>
        function getComputerChoice () {
            let random = Math.floor(Math.random() * 3);
            switch (random) {
                case 0:
                    console.log('rock');
                    return 'rock';
                case 1:
                    console.log('paper');
                    return 'paper';
                case 2:
                    console.log('scissors');
                    return 'scissors';
            }
        }
        
        
    </script>
